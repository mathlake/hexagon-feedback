name: Documentation issue
description: Report unclear, incorrect, or missing public documentation.
title: "[Docs]: "
labels:
  - documentation
  - needs-triage
body:
  - type: input
    id: location
    attributes:
      label: Page or section
      description: Provide a public URL or page title.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear, incorrect, or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a matching report.
          required: true
        - label: This report contains no private or personal information.
          required: true
